name: Version Check

on:
  pull_request:

jobs:
  version-check:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'bump/')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - name: Verify version consistency
        run: |
          BRANCH_VERSION="${GITHUB_HEAD_REF#bump/}"

          if ! echo "$BRANCH_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Branch version '$BRANCH_VERSION' is not a valid semver format (expected: X.Y.Z)"
            exit 1
          fi

          CARGO_VERSION=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[0].version')
          LOCK_VERSION=$(grep -A1 'name = "copse"' Cargo.lock | grep 'version' | sed 's/.*"\(.*\)".*/\1/')

          echo "Branch version: $BRANCH_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"
          echo "Cargo.lock version: $LOCK_VERSION"

          if [ "$BRANCH_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match branch version ($BRANCH_VERSION)"
            exit 1
          fi

          if [ "$BRANCH_VERSION" != "$LOCK_VERSION" ]; then
            echo "::error::Cargo.lock version ($LOCK_VERSION) does not match branch version ($BRANCH_VERSION)"
            exit 1
          fi

          echo "All versions match: $BRANCH_VERSION"
