name: Update Homebrew Formula

on:
  push:
    tags:
      - 'v*'

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-copse
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: daiwahome/homebrew-copse
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update Formula tag
        run: |
          sed -i 's|tag: "v[^"]*"|tag: "${{ github.ref_name }}"|' Formula/copse.rb

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          commit-message: "copse ${{ steps.version.outputs.version }}"
          title: "copse ${{ steps.version.outputs.version }}"
          body: "Automated update from [copse ${{ github.ref_name }}](https://github.com/daiwahome/copse/releases/tag/${{ github.ref_name }})"
          branch: "update-${{ github.ref_name }}"
