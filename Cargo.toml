[package]
name = "copse"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "copse"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.28"
portable-pty = "0.8"
tui-term = "0.3"
vt100 = "0.16"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
nix = { version = "0.31.2", features = ["signal"] }
etcetera = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
ansi-to-tui = "8"
unicode-width = "0.2"
